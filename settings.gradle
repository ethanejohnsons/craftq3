pluginManagement {
    includeBuild 'build-logic'
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'craftq3'

// Rewrite projects. Allowed dependency edges live in build-logic/.../ModuleGraph.groovy.
include ':engine:common', ':engine:fs', ':engine:formats', ':engine:console', ':engine:net'
include ':engine:vm', ':engine:vm-abi', ':engine:collision', ':engine:botlib', ':engine:game'
include ':engine:render-ir', ':engine:audio', ':engine:client', ':engine:session'
include ':engine:headless', ':engine:testkit'
include ':mc:hybrid', ':mc:fabric'
include ':tools:trace-format', ':tools:legacy-oracle', ':tools:arch-check'

// Legacy engine: the behavioural oracle for the rewrite. Each module is deleted once its
// replacement reaches parity (docs/REWRITE.md).
['core', 'assets', 'render', 'collision', 'botlib', 'vm', 'server', 'client', 'platform'].each {
    include ":craftq3-$it"
    project(":craftq3-$it").projectDir = file("legacy/craftq3-$it")
}
