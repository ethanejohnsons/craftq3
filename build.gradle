plugins {
    id 'base'
    id 'craftq3.module-graph'
}

def rewriteProjects = { subprojects.findAll { craftq3.ModuleGraph.isRewrite(it) && it.childProjects.isEmpty() } }
def portableProjects = { rewriteProjects().findAll { !(it.path in [':mc:fabric', ':mc:devharness']) } }

tasks.named('build') { dependsOn subprojects.findAll { it.childProjects.isEmpty() }.collect { "${it.path}:build" } }
tasks.named('check') { dependsOn subprojects.findAll { it.childProjects.isEmpty() }.collect { "${it.path}:check" } }

// Everything that must pass on Windows, Linux and macOS: the rewrite without Minecraft.
tasks.register('portableCheck') {
    group = 'verification'
    description = 'Checks every rewrite project except the Minecraft mod; run by the CI OS matrix.'
    dependsOn portableProjects().collect { "${it.path}:check" }
}
