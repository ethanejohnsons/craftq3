plugins {
    id 'craftq3.engine-module'
    id 'application'
}
dependencies {
    api project(':engine:session')
    testImplementation project(':engine:testkit')
}
application {
    mainClass = 'dev.bluevista.craftq3.engine.headless.HeadlessServer'
    applicationDefaultJvmArgs = ['-Xmx2g']
}
tasks.named('run', JavaExec) {
    standardInput = System.in
    environment 'CRAFTQ3_Q3ROOT', providers.environmentVariable('CRAFTQ3_Q3ROOT').getOrElse('')
}
tasks.named('test') {
    // The opt-in real-data flows run the original VMs with bots and a minute-long soak.
    maxHeapSize = '3g'
    jvmArgs '-ea'
    testLogging { showStandardStreams = providers.environmentVariable('CRAFTQ3_Q3ROOT').isPresent() }
}

// The plan's §4 compatibility sweep over $CRAFTQ3_Q3ROOT: ./gradlew :engine:headless:compatSweep
// (-Pcompat.seconds=120 -Pcompat.maps=2 -Pcompat.games=baseq3,cpma -Pcompat.skip=cinematics).
tasks.register('compatSweep', JavaExec) {
    group = 'verification'
    description = 'Runs every game directory of $CRAFTQ3_Q3ROOT through the session; writes build/compat/report.{json,md}.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.bluevista.craftq3.engine.headless.CompatSweep'
    maxHeapSize = '3g'
    jvmArgs '-ea'
    def out = layout.buildDirectory.dir('compat')
    def seconds = providers.gradleProperty('compat.seconds').getOrElse('30')
    def maps = providers.gradleProperty('compat.maps').getOrElse('1')
    def games = providers.gradleProperty('compat.games').getOrElse('')
    def skip = providers.gradleProperty('compat.skip').getOrElse('')
    def q3Root = providers.environmentVariable('CRAFTQ3_Q3ROOT')
    if (q3Root.isPresent()) environment 'CRAFTQ3_Q3ROOT', q3Root.get()
    argumentProviders.add({ ->
        ['--out', out.get().asFile.path, '--seconds', seconds, '--maps', maps, '--games', games, '--skip', skip]
    } as CommandLineArgumentProvider)
    // Never up to date: the installation lives outside the build.
    outputs.upToDateWhen { false }
}

// A long real-time soak (local game, bots, heap after a full GC sampled at an interval):
// ./gradlew :engine:headless:soak -Psoak.minutes=60 -Psoak.sampleMinutes=5 -Psoak.map=q3dm17
// -Psoak.bots=4; writes build/soak/heap.csv and summary.txt.
tasks.register('soak', JavaExec) {
    group = 'verification'
    description = 'Plays a local game with bots in real time on $CRAFTQ3_Q3ROOT and records the retained heap.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.bluevista.craftq3.engine.headless.Soak'
    maxHeapSize = '2g'
    jvmArgs '-ea'
    def out = layout.buildDirectory.dir('soak')
    def minutes = providers.gradleProperty('soak.minutes').getOrElse('60')
    def sample = providers.gradleProperty('soak.sampleMinutes').getOrElse('5')
    def map = providers.gradleProperty('soak.map').getOrElse('q3dm17')
    def bots = providers.gradleProperty('soak.bots').getOrElse('4')
    def q3Root = providers.environmentVariable('CRAFTQ3_Q3ROOT')
    if (q3Root.isPresent()) environment 'CRAFTQ3_Q3ROOT', q3Root.get()
    argumentProviders.add({ ->
        ['--out', out.get().asFile.path, '--minutes', minutes, '--sample-minutes', sample, '--map', map, '--bots', bots]
    } as CommandLineArgumentProvider)
    outputs.upToDateWhen { false }
}
