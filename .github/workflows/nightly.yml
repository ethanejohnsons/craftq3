name: Nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # Full build plus the Fabric server GameTests on a dedicated GameTest server. Real-data tests
  # skip themselves here: retail Quake III data never enters hosted CI.
  gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build :mc:devharness:runGameTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gametest-reports
          path: |
            **/build/reports/tests/
            mc/devharness/build/test-results/gameTest/

  # Everything that needs a real installation and a GPU: every @RealData test, the compatibility
  # sweep and the client game tests on OpenGL and Vulkan. It runs only on a self-hosted runner
  # labelled `craftq3-q3data` whose owner set the repository variable CRAFTQ3_Q3ROOT to their own
  # Quake III installation on that machine.
  real-data:
    if: vars.CRAFTQ3_Q3ROOT != ''
    runs-on: [self-hosted, craftq3-q3data]
    env:
      CRAFTQ3_Q3ROOT: ${{ vars.CRAFTQ3_Q3ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check :engine:headless:compatSweep
      - run: ./gradlew :mc:devharness:runGameTest :mc:devharness:runClientGameTest :mc:devharness:runClientGameTestVulkan
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: |
            engine/headless/build/compat/
            mc/devharness/build/run/clientGameTest/screenshots/
            mc/devharness/build/run/clientGameTestVulkan/screenshots/
