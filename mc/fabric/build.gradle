// The Minecraft adapter. `main` is common/dedicated-server code; `client` holds everything that
// needs the Minecraft client (screens, rendering, audio, input). Loom enforces the split.
plugins {
    id 'craftq3.java-conventions'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = rootProject.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        craftq3 {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation project(':engine:session')
    implementation project(':mc:hybrid')
    // Nest every engine module the mod reaches so the distributable jar is self-contained.
    craftq3.ModuleGraph.closure(project.path).each { include project(it) }
}

processResources {
    inputs.properties version: project.version, loader_version: loader_version,
        minecraft_version: minecraft_version, fabric_version: fabric_version
    filesMatching("fabric.mod.json") {
        expand version: project.version, loader_version: loader_version,
            minecraft_version: minecraft_version, fabric_version: fabric_version
    }
}
