pluginManagement {
    includeBuild 'build-logic'
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'craftq3'

// Allowed dependency edges live in build-logic/.../ModuleGraph.groovy.
include ':engine:common', ':engine:fs', ':engine:formats', ':engine:console', ':engine:net'
include ':engine:vm', ':engine:vm-abi', ':engine:collision', ':engine:botlib', ':engine:game'
include ':engine:render-ir', ':engine:audio', ':engine:client', ':engine:session'
include ':engine:headless', ':engine:testkit'
include ':mc:hybrid', ':mc:fabric', ':mc:devharness'
include ':tools:arch-check'
